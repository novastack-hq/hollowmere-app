# Actions enabled 19 Nov 2026
# CI for the Hollowmere app.
#  - Every pull request, and every push to dev or production: tests and Ruff.
#  - Every release tag (v1.0, v1.1, ...), made on the production branch: build
#    the image for Intel and Apple-silicon machines and publish it to ghcr.io
#    as ghcr.io/novastack-hq/hollowmere-app:1.0 (the tag without the "v").
name: CI

on:
  pull_request:
  push:
    branches: [dev, production]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The check the rulesets on dev and production ask for.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub's registry (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build for amd64 and arm64, and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$VERSION" --push .
          echo "Published $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
